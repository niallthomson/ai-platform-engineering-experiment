[project]
name = "default-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[a2a,openai]>=1.10.0",
    "strands-agents-builder>=0.1.10",
    "strands-agents-tools>=0.2.9",
    "dynaconf>=3.2.11",
    "httpx>=0.28.1",
    "a2a-sdk>=0.3.8",
    "pyjwt[crypto]>=2.10.1",
]

[project.scripts]
default-agent = "default_agent.agent:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
