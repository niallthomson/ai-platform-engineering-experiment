[project]
name = "default-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[a2a,openai,anthropic,otel]==1.17.0",
    "strands-agents-tools>=0.2.16",
    "dynaconf>=3.2.11",
    "httpx>=0.28.1",
    "a2a-sdk>=0.3.15",
    "pyjwt[crypto]>=2.10.1",
    "fastmcp>=2.13.0.2",
    "jinja2>=3.1.6",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "redis[hiredis]>=5.2.1",
    "mcp-proxy-for-aws>=1.1.1",
]

[project.scripts]
default-agent = "default_agent.agent:main"
test = "pytest:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
