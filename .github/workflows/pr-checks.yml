name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  default-agent:
    name: Default Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: jdx/mise-action@v2
      
      - name: Build
        working-directory: agents/default
        run: uv build
      
      - name: Test
        working-directory: agents/default
        run: uv run test
      
      - name: Build Docker image
        working-directory: agents/default
        run: docker build -t default-agent:test .

  slack-bot:
    name: Slack Bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: jdx/mise-action@v2
      
      - name: Build
        working-directory: slack-bot
        run: uv build
      
      - name: Build Docker image
        working-directory: slack-bot
        run: docker build -t slack-bot:test .

  helm-chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: jdx/mise-action@v2
      
      - name: Test Helm chart
        working-directory: helm
        run: helm upgrade --install platform-ai . -f values.example.yaml --set agentDefaults.auth.bearer.token=dummy --dry-run
