[project]
name = "slack-bot"
version = "0.1.0"
description = "A2A agent integration for Slack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=0.3.8",
    "aiohttp>=3.11.18",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.0",
    "pydantic>=2.12.4",
    "python-dotenv>=1.1.0",
    "slack-bolt>=1.27.0",
    "dynaconf>=3.2.11",
]

[project.scripts]
slack-bot = "slack_bot.bot:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
