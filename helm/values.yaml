# Default values for platform-ai.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Container image configuration
image:
  repository: your-registry/default-agent
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Default configuration for all agents
agentDefaults:
  replicas: 1

  secret:
    create: true
    name: ""
    annotations: {}
    data: {}

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext:
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 9000

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []

  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

  livenessProbe:
    httpGet:
      path: /health
      port: http
  readinessProbe:
    httpGet:
      path: /health
      port: http

  auth:
    mode: bearer

  model:
    provider: bedrock
    model_id: "us.anthropic.claude-sonnet-4-20250514-v1:0"
    bedrock:
      region: us-west-2
    openai:
      base_url: ""

  opentelemetry:
    endpoint: ""
    token: ""

  sessions:
    storage:
      mode: file  # or "redis" (default: "file")
      # redis:
      #   url: "redis://localhost:6379"
      #   key_prefix: "agent"  # default: "agent"

  a2a:
    task_store:
      mode: memory  # or "redis" (default: "memory")
      # redis:
      #   url: "redis://localhost:6379"
      #   key_prefix: "a2a"  # default: "a2a"
    queue_manager:
      mode: none  # or "redis" (default: "none")
      # redis:
      #   url: "redis://localhost:6379"
      #   key_prefix: "a2a"  # default: "a2a"

  mcp:
    enabled: false
    token_store:
      mode: memory


