# Slack Bot
slackBot:
  enabled: false
  replicas: 1

  image:
    repository: your-registry/slack-bot
    pullPolicy: IfNotPresent
    tag: "latest"

  secret:
    create: true
    name: ""
    annotations: {}
    data: {}

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}

  securityContext: {}

  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 256Mi

  nodeSelector: {}

  tolerations: []

  affinity: {}

  botToken: "xoxb-your-bot-token"
  appToken: "xapp-your-app-token"

  a2a:
    # Reference an agent by ID (URL auto-generated)
    agentId: ""
    # Or use a full URL for external agents
    url: ""

  auth:
    mode: bearer  # or "oidc"
    bearer:
      token: ""
    # oidc:
    #   configuration_url: ""
    #   client_id: ""
    #   client_secret: ""
    #   scope: "openid profile email"
    #   token_store:
    #     backend: memory  # or "redis"
    #     redis:
    #       url: "redis://localhost:6379"
    #       key_prefix: ""
    #     encryption_key: ""  # Required for redis backend

redis:
  deploy: true
  haproxy:
    enabled: true