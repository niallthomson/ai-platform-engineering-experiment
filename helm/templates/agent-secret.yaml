{{- range .Values.agents }}
{{- $agent := . }}
{{- $ctx := dict "root" $ "agent" $agent }}
{{- $config := mustMergeOverwrite (deepCopy $.Values.agentDefaults) (omit $agent "name" "description" "system_prompt") }}
{{- if $config.secret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $config.secret.name | default (include "platform-ai.agentFullname" $ctx) }}
  labels:
    {{- include "platform-ai.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $agent.id }}
  {{- with $config.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
{{- if $config.secret.data }}
data:
  {{- range $key, $value := $config.secret.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
