{{- if and .Values.slackBot.enabled (or (not .Values.slackBot.secret) (and .Values.slackBot.secret .Values.slackBot.secret.create)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.slackBot.secret.name | default (include "platform-ai.slackBotFullname" .) }}
  labels:
    {{- include "platform-ai.labels" . | nindent 4 }}
    app.kubernetes.io/type: slack-bot
  {{- with .Values.slackBot.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  SLACKBOT_SLACK__BOT_TOKEN: {{ .Values.slackBot.botToken | b64enc | quote }}
  SLACKBOT_SLACK__APP_TOKEN: {{ .Values.slackBot.appToken | b64enc | quote }}
  {{- if .Values.slackBot.auth }}
  {{- if eq .Values.slackBot.auth.mode "bearer" }}
  SLACKBOT_AUTH__BEARER__TOKEN: {{ .Values.slackBot.auth.bearer.token | b64enc | quote }}
  {{- else if eq .Values.slackBot.auth.mode "oidc" }}
  {{- if .Values.slackBot.auth.oidc.client_secret }}
  SLACKBOT_AUTH__OIDC__CLIENT_SECRET: {{ .Values.slackBot.auth.oidc.client_secret | b64enc | quote }}
  {{- end }}
  {{- if .Values.slackBot.auth.oidc.token_store }}
  {{- if .Values.slackBot.auth.oidc.token_store.encryption_key }}
  SLACKBOT_AUTH__OIDC__TOKEN_STORE__ENCRYPTION_KEY: {{ .Values.slackBot.auth.oidc.token_store.encryption_key | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- range $key, $value := .Values.slackBot.secret.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
