{{- range .Values.mcpServers }}
{{- $mcpServer := . }}
{{- $ctx := dict "root" $ "mcpServer" $mcpServer }}
{{- if or (not $mcpServer.secret) (and $mcpServer.secret $mcpServer.secret.create) }}
{{- $mcpSecret := $mcpServer.secret | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $mcpSecret.name | default (include "platform-ai.mcpServerFullname" $ctx) }}
  labels:
    {{- include "platform-ai.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $mcpServer.id }}
  {{- with $mcpSecret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
{{- if $mcpSecret.data }}
data:
  {{- range $key, $value := $mcpSecret.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
