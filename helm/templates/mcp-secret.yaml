{{- range .Values.mcpServers }}
{{- $mcpServer := . }}
{{- $ctx := dict "root" $ "mcpServer" $mcpServer }}
{{- if $mcpServer.secret }}
{{- if $mcpServer.secret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $mcpServer.secret.name | default (include "platform-ai.mcpServerFullname" $ctx) }}
  labels:
    {{- include "platform-ai.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $mcpServer.id }}
  {{- with $mcpServer.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
{{- if $mcpServer.secret.data }}
data:
  {{- range $key, $value := $mcpServer.secret.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
