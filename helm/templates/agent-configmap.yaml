{{- range $agentId, $agent := .Values.agents }}
{{- $agentWithId := merge (dict "id" $agentId) $agent }}
{{- $ctx := dict "root" $ "agent" $agentWithId }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-ai.agentFullname" $ctx }}
  labels:
    {{- include "platform-ai.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $agentId }}
data:
  AGENT_NAME: {{ $agent.name | quote }}
  AGENT_DESCRIPTION: {{ $agent.description | quote }}
  AGENT_SYSTEM_PROMPT: {{ $agent.system_prompt | quote }}
  AGENT_SERVER__HOST: 0.0.0.0
  {{- if $agent.mcpServers }}
  AGENT_MCP_SERVERS: {{ include "platform-ai.mcpServersToPython" (dict "servers" $agent.mcpServers "root" $) | quote }}
  {{- end }}
  {{- if $agent.server }}
  AGENT_SERVER__URL: {{ $agent.server.url | default (printf "http://%s.%s.svc.cluster.local" (include "platform-ai.agentFullname" $ctx) $.Release.Namespace) | quote }}
  {{- else }}
  AGENT_SERVER__URL: {{ printf "http://%s.%s.svc.cluster.local" (include "platform-ai.agentFullname" $ctx) $.Release.Namespace | quote }}
  {{- end }}
  {{- if $agent.a2a }}
  {{- $peerUrls := list }}
  {{- if $agent.a2a.peerAgents }}
  {{- range $agent.a2a.peerAgents }}
  {{- $peerCtx := dict "root" $ "agent" (dict "id" .) }}
  {{- $peerUrls = append $peerUrls (printf "http://%s.%s.svc.cluster.local" (include "platform-ai.agentFullname" $peerCtx) $.Release.Namespace) }}
  {{- end }}
  {{- end }}
  {{- if $agent.a2a.peerAgentUrls }}
  {{- $peerUrls = concat $peerUrls $agent.a2a.peerAgentUrls }}
  {{- end }}
  {{- if $peerUrls }}
  AGENT_A2A__PEER_AGENTS: {{ toJson $peerUrls | quote }}
  {{- end }}
  {{- end }}
  {{- $config := mustMergeOverwrite (deepCopy $.Values.agentDefaults) (omit $agent "name" "description" "system_prompt" "mcpServers" "a2a") }}
  {{- if $config.mcp.enabled }}
  AGENT_MCP__ENABLED: "true"
  {{- if $ctx.root.Values.redis.deploy }}
  AGENT_MCP__TOKEN_STORE__REDIS__URL: {{ printf "redis://%s-redis-haproxy.%s.svc.cluster.local" (include "platform-ai.name" $ctx.root) $.Release.Namespace | quote }}
  AGENT_MCP__TOKEN_STORE__REDIS__KEY_PREFIX: {{ $ctx.agent.id | quote }}
  {{- else if eq $config.mcp.token_store.mode "redis" }}
  AGENT_MCP__TOKEN_STORE__REDIS__URL: {{ $config.mcp.token_store.redis.url | quote }}
  AGENT_MCP__TOKEN_STORE__REDIS__KEY_PREFIX: {{ $config.mcp.token_store.redis.key_prefix | quote }}
  {{- end }}
  {{- end }}
  {{- if $config.model }}
  AGENT_MODEL__PROVIDER: {{ $config.model.provider | quote }}
  AGENT_MODEL__MODEL_ID: {{ $config.model.model_id | quote }}
  {{- if eq $config.model.provider "bedrock" }}
  {{- if $config.model.bedrock }}
  AGENT_MODEL__BEDROCK__REGION: {{ $config.model.bedrock.region | quote }}
  {{- end }}
  {{- else if eq $config.model.provider "openai" }}
  {{- if $config.model.openai }}
  {{- if $config.model.openai.base_url }}
  AGENT_MODEL__OPENAI__BASE_URL: {{ $config.model.openai.base_url | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $config.auth }}
  AGENT_AUTH__MODE: {{ $config.auth.mode | quote }}
  {{- if eq $config.auth.mode "oidc" }}
  AGENT_AUTH__OIDC__CONFIGURATION_URL: {{ $config.auth.oidc.configuration_url | quote }}
  AGENT_AUTH__OIDC__AUDIENCES: {{ toJson $config.auth.oidc.audiences | quote }}
  AGENT_AUTH__OIDC__CLIENT_ID: {{ $config.auth.oidc.client_id | quote }}
  {{- end }}
  {{- end }}
  {{- if $ctx.root.Values.redis.deploy }}
  AGENT_SESSIONS__STORAGE__MODE: redis
  AGENT_SESSIONS__STORAGE__REDIS__URL: {{ printf "redis://%s-redis-haproxy.%s.svc.cluster.local" (include "platform-ai.name" $ctx.root) $.Release.Namespace | quote }}
  AGENT_SESSIONS__STORAGE__REDIS__KEY_PREFIX: {{ $ctx.agent.id | quote }}
  AGENT_A2A__TASK_STORE__MODE: redis
  AGENT_A2A__TASK_STORE__REDIS__URL: {{ printf "redis://%s-redis-haproxy.%s.svc.cluster.local" (include "platform-ai.name" $ctx.root) $.Release.Namespace | quote }}
  AGENT_A2A__TASK_STORE__REDIS__KEY_PREFIX: {{ $ctx.agent.id | quote }}
  {{- else }}
  AGENT_SESSIONS__STORAGE__MODE: {{ $config.sessions.storage.mode | quote }}
  {{- if eq $config.sessions.storage.mode "redis" }}
  AGENT_SESSIONS__STORAGE__REDIS__URL: {{ $config.sessions.storage.redis.url | quote }}
  AGENT_SESSIONS__STORAGE__REDIS__KEY_PREFIX: {{ $config.sessions.storage.redis.key_prefix | quote }}
  {{- end }}
  AGENT_A2A__TASK_STORE__MODE: {{ $config.a2a.task_store.mode | quote }}
  {{- if eq $config.a2a.task_store.mode "redis" }}
  AGENT_A2A__TASK_STORE__REDIS__URL: {{ $config.a2a.task_store.redis.url | quote }}
  AGENT_A2A__TASK_STORE__REDIS__KEY_PREFIX: {{ $config.a2a.task_store.redis.key_prefix | quote }}
  {{- end }}
  AGENT_A2A__QUEUE_MANAGER__MODE: {{ $config.a2a.queue_manager.mode | quote }}
  {{- if eq $config.a2a.queue_manager.mode "redis" }}
  AGENT_A2A__QUEUE_MANAGER__REDIS__URL: {{ $config.a2a.queue_manager.redis.url | quote }}
  AGENT_A2A__QUEUE_MANAGER__REDIS__KEY_PREFIX: {{ $config.a2a.queue_manager.redis.key_prefix | quote }}
  {{- end }}
  {{- end }}
  {{- if ne $.Values.agentDefaults.opentelemetry.endpoint "" }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ $.Values.agentDefaults.opentelemetry.endpoint | quote }}
  {{- end }}
{{- end }}
