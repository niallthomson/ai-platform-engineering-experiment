{{- range .Values.agents }}
{{- $agent := . }}
{{- $ctx := dict "root" $ "agent" $agent }}
{{- $config := mustMergeOverwrite (deepCopy $.Values.agentDefaults) (omit $agent "name" "description" "system_prompt") }}
{{- if $config.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "platform-ai.agentFullname" $ctx }}
  labels:
    {{- include "platform-ai.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $agent.id }}
  {{- with $config.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $config.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $config.ingress.tls }}
  tls:
    {{- toYaml $config.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- if $config.ingress.hosts }}
    {{- range $config.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform-ai.agentFullname" $ctx }}
                port:
                  number: 80
    {{- end }}
    {{- else }}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform-ai.agentFullname" $ctx }}
                port:
                  number: 80
    {{- end }}
{{- end }}
{{- end }}
